<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Práctica películas</title>
    <script defer src="./scripts.js"></script>
    <link rel="stylesheet" href="./styles/style.css" />
  </head>
  <body>
    <header>
      <h1>PRÁCTICA PELÍCULAS</h1>
    </header>

    <main>
      <section>
        <h2>Bienvenidos</h2>
        <p>
          En esta mini app puedes hacer un seguimiento de las Películas que has
          visto ultimamente añadiendolas a una table.
        </p>
      </section>
      <section>
        <h2>Añadir nueva película</h2>
        <form class="movies-form" id="moviesForm">
          <label for="title">Título</label>
          <input type="text" id="title" name="title" required />

          <label for="year">Año</label>
          <input type="number" id="year" name="year" min="1800" required />

          <label for="description">Descripción</label>
          <textarea id="description" name="description" rows="4"></textarea>

          <label for="img">URL de la foto</label>
          <input type="url" id="img" name="img" />
          <img id="preview" />
          <label for="genre">Género</label>
          <select id="genre" name="genre">
            <option value="terror">Terror</option>
            <option value="accion">Acción</option>
            <option value="comedia">Comedia</option>
            <option value="romantica">Romántica</option>
          </select>

          <button type="enviar">Añadir película</button>
        </form>
      </section>
      <section class="filters" id="filters">
        <h2>Filtros</h2>
        <select id="filter-genre" class="filter-genre">
          <option value="">Todos los géneros</option>
          <option value="terror">Terror</option>
          <option value="accion">Acción</option>
          <option value="comedia">Comedia</option>
          <option value="romantica">Romántica</option>
        </select>

        <input
          type="text"
          id="filter-title"
          class="filter-title"
          placeholder="Buscar película..."
        />
      </section>

      <section>
        <div id="table-Movies"></div>
      </section>
    </main>

    <div id="modal-edit" class="modal">
      <div class="modal-contenido">
        <span id="cerrar-modal" class="modal-cerrar">&times;</span>
        <h2 class="modal-title">Editar Película</h2>
        <form id="form-edit">
          <label>Título: <input type="text" id="edit-title" required /></label>
          <label
            >year:
            <input type="number" id="edit-year" min="1888" max="2100" required
          /></label>
          <label
            >Descripción: <textarea id="edit-description" required></textarea>
          </label>
          <label
            >URL img: <input type="url" id="edit-img" required
          /></label>
          <label
            >Género:
            <select id="edit-genre" required>
              <option value="terror">Terror</option>
              <option value="accion">Acción</option>
              <option value="comedia">Comedia</option>
              <option value="romantica">Romántica</option>
            </select>
          </label>
          <button type="submit">Guardar Cambios</button>
        </form>
      </div>
    </div>
  </body>
</html>
